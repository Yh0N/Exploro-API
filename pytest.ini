[pytest]
testpaths = tests
pythonpath = .
markers =
    integration: pruebas con PostgreSQL/PostGIS real (Testcontainers o DATABASE_URL en CI)
    security: pruebas de seguridad automatizadas (subset puede requerir BD)
    performance: pruebas de carga (ejecutar con Locust, no con pytest directamente)
    slow: pruebas que demoran mas de 10 segundos (rate limiting, etc.)
addopts = -v --strict-markers
filterwarnings =
    ignore::DeprecationWarning:passlib
    ignore::DeprecationWarning:jose
